name: Deploy to Cloudflare

# Runs on every push to main, or by hand from the Actions tab.
# First run creates the D1 database and the Pages project; later runs just update them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: officedays
      DB_NAME: officedays
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. See the README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find the D1 database
        if: steps.creds.outputs.ready == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME"
            id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          echo "D1 database id: $id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Create the Pages project if needed
        if: steps.creds.outputs.ready == 'true'
        # Fails harmlessly when the project already exists.
        run: npx wrangler pages project create "$PROJECT" --production-branch main || true

      # Secrets only reach deployments made after they are set, so this runs before the deploy.
      - name: Set app secrets
        if: steps.creds.outputs.ready == 'true'
        env:
          SIGNUP_CODE: ${{ secrets.SIGNUP_CODE }}
          QR_SITEKEY: ${{ secrets.QR_SITEKEY }}
        run: |
          jq -n --arg s "$SIGNUP_CODE" --arg q "$QR_SITEKEY" \
            '{SIGNUP_CODE: $s, QR_SITEKEY: $q} | with_entries(select(.value != ""))' > secrets.json
          [ -n "$SIGNUP_CODE" ] || echo "::warning::SIGNUP_CODE is not set, so anyone with the link can create an account."
          if [ "$(jq length secrets.json)" -gt 0 ]; then
            npx wrangler pages secret bulk secrets.json --project-name "$PROJECT"
          fi
          rm secrets.json

      - name: Build and deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm run build
          npx wrangler pages deploy --project-name "$PROJECT" --branch main --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### Deployed to https://$PROJECT.pages.dev (this build: $url)" >> "$GITHUB_STEP_SUMMARY"
