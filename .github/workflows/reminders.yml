name: Office day reminders

# Checks every hour who is due a reminder (their chosen day and hour, in their timezone)
# and sends a push notification to anyone behind their target.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency: reminders

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send reminders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/send-reminders.ts
